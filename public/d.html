<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LanDrop · 分享盘</title>
<meta name="theme-color" content="#f1f3ef" />
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/assets/tokens.css" />
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
<div class="phone-stage">
  <div class="ld-mobile" id="app">
    <header class="web-top">
      <div class="web-brand">
        <span class="app-logo" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg>
        </span>
        <strong>LanDrop</strong>
      </div>
      <span class="web-badge">分享盘</span>
    </header>

    <section class="conn web-session">
      <div class="conn-top">
        <span class="live-pill" id="live-pill"><span class="dot dot-live" aria-hidden="true"></span><span id="live-text">已连接</span></span>
        <span class="conn-net mono">同一 Wi‑Fi</span>
      </div>
      <h1 id="drive-name">正在打开…</h1>
      <p class="conn-addr mono" id="host-name">—</p>
      <p class="drive-note" id="drive-note" hidden></p>
      <div class="conn-foot">
        <span id="file-count">载入中</span>
        <span class="mono" id="drive-mode">—</span>
      </div>
    </section>

    <section class="card up-card" id="up-card" hidden>
      <div class="card-head">
        <div>
          <h2>放进这个盘</h2>
          <p>老板/同事都能立刻看到，电脑端会收到提醒</p>
        </div>
        <span class="eyebrow">Upload</span>
      </div>
      <button class="upload-btn" type="button" id="upload-btn">
        <span class="upload-plus" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5"/><path d="m7.5 9.5 4.5-4.5 4.5 4.5"/><path d="M5 15v3.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
        </span>
        <span class="upload-text"><strong>选择文件上传</strong><span id="upload-hint">原图不压缩 · 支持多选</span></span>
      </button>
      <input type="file" id="file-input" multiple hidden />
      <div class="up-list" id="progress" aria-live="polite"></div>
    </section>

    <div class="web-limit" id="sent-note" hidden>
      <span class="web-limit-icon" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
      <div>
        <strong>已经交给对方了</strong>
        <p>文件现在在对方的「待拾取」里，由他决定收进库还是丢弃。你不需要再等。</p>
      </div>
    </div>

    <section class="block">
      <div class="block-head">
        <h2>盘里的文件</h2>
        <span class="count" id="list-count">—</span>
      </div>
      <div class="web-tools">
        <label class="web-search">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.4"/><path d="m10.4 10.4 3 3"/></svg>
          <input type="search" id="d-search" placeholder="搜索文件名" autocomplete="off" />
        </label>
      </div>
      <div class="web-batches" id="batches">
        <div class="empty-state"><h3>正在读取</h3><p>稍等，正在从这台电脑取盘里的文件。</p></div>
      </div>
      <p class="list-note">点文件行可以预览，点「下载」保存到手机。文件不经过任何云端，离开这个 Wi‑Fi 就打不开了。</p>
    </section>

    <p class="web-foot mono" id="foot">LanDrop drive</p>
  </div>
</div>
<div class="sheet-scrim" id="sheet-scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name" hidden>
  <header class="sheet-head">
    <div>
      <h2 id="sheet-name">文件</h2>
      <p id="sheet-sub">—</p>
    </div>
    <button class="sheet-close" type="button" id="sheet-close" aria-label="关闭预览">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>
    </button>
  </header>
  <div class="sheet-body" id="sheet-body"></div>
  <footer class="sheet-foot">
    <input type="hidden" id="sheet-current" value="" />
    <button class="btn btn-ghost m-btn" type="button" id="sheet-download">下载到手机</button>
  </footer>
</section>

<div class="mobile-toasts" id="toasts" aria-live="polite"></div>
<script src="/js/d.js"></script>
</body>
</html>
